<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DevFest 2026 — Registration</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(135deg, #1e1b4b 0%, #312e81 45%, #4338ca 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 16px;
    color: #1f2937;
  }
  .card {
    background: #ffffff;
    width: 100%;
    max-width: 520px;
    border-radius: 16px;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
    overflow: hidden;
  }
  .hero {
    background: linear-gradient(120deg, #4f46e5, #7c3aed);
    color: #fff;
    padding: 32px 36px 28px;
  }
  .hero .badge {
    display: inline-block;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    background: rgba(255, 255, 255, 0.18);
    border: 1px solid rgba(255, 255, 255, 0.3);
    border-radius: 999px;
    padding: 4px 12px;
    margin-bottom: 12px;
  }
  .hero h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.02em; }
  .hero p { margin-top: 6px; font-size: 14px; opacity: 0.85; }
  form { padding: 32px 36px 36px; }
  .field { margin-bottom: 18px; }
  label.top {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #374151;
    margin-bottom: 6px;
  }
  input[type="text"], input[type="email"], input[type="tel"], select, textarea {
    width: 100%;
    font: inherit;
    font-size: 15px;
    color: #111827;
    background: #f9fafb;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    padding: 10px 12px;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  input:focus, select:focus, textarea:focus {
    border-color: #6366f1;
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.18);
    background: #fff;
  }
  textarea { resize: vertical; min-height: 72px; }
  .row { display: flex; gap: 14px; }
  .row .field { flex: 1; }
  label.check {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    color: #374151;
    cursor: pointer;
    margin: 4px 0 22px;
  }
  label.check input { width: 17px; height: 17px; accent-color: #4f46e5; }
  button[type="submit"] {
    width: 100%;
    font: inherit;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(120deg, #4f46e5, #7c3aed);
    border: none;
    border-radius: 10px;
    padding: 14px;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(79, 70, 229, 0.35);
    transition: transform 0.1s, box-shadow 0.15s;
  }
  button[type="submit"]:hover { transform: translateY(-1px); box-shadow: 0 10px 24px rgba(79, 70, 229, 0.45); }
  .fineprint { margin-top: 14px; font-size: 12px; color: #9ca3af; text-align: center; }
  .sponsors { padding: 0 36px 30px; }
  .sponsors iframe {
    width: 100%;
    height: 64px;
    border: 1px dashed #e5e7eb;
    border-radius: 10px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="hero">
      <span class="badge">April 18–19 · Tel Aviv Expo</span>
      <h1>DevFest 2026</h1>
      <p>Reserve your spot — two days of talks, workshops, and way too much coffee.</p>
    </div>
    <form method="get" action="success.html">
      <div class="field">
        <label class="top" for="fullname">Full name</label>
        <input type="text" id="fullname" name="full_name" placeholder="Ada Lovelace" required>
      </div>
      <div class="row">
        <div class="field">
          <label class="top" for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required>
        </div>
        <div class="field">
          <label class="top" for="phone">Phone</label>
          <input type="tel" id="phone" name="phone" placeholder="+972 50 000 0000">
        </div>
      </div>
      <div class="row">
        <div class="field">
          <label class="top" for="company">Company / School</label>
          <input type="text" id="company" name="company" placeholder="Where do you build things?">
        </div>
        <div class="field">
          <label class="top" for="tshirt">T-shirt size</label>
          <select id="tshirt" name="tshirt_size">
            <option>S</option>
            <option selected>M</option>
            <option>L</option>
            <option>XL</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label class="top" for="diet">Dietary needs</label>
        <textarea id="diet" name="dietary_needs" placeholder="Vegetarian, allergies, kosher…"></textarea>
      </div>
      <label class="check">
        <input type="checkbox" name="newsletter" value="yes">
        Subscribe to newsletter
      </label>
      <button type="submit">Register now</button>
      <p class="fineprint">Free admission · Limited to 800 attendees</p>
    </form>
    <div class="sponsors">
      <iframe title="Sponsors" srcdoc="&lt;body style='margin:0;font-family:Segoe UI,Arial,sans-serif;background:#fafafa;display:flex;align-items:center;justify-content:center;height:100vh;font-size:13px;color:#6b7280'&gt;Community partners — &lt;a href='#' style='color:#4f46e5;margin-left:6px'&gt;see all sponsors&lt;/a&gt;&lt;/body&gt;"></iframe>
    </div>
  </div>
</body>
</html>
