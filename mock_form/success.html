<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registered — DevFest 2026</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(135deg, #1e1b4b 0%, #312e81 45%, #4338ca 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 16px;
  }
  .card {
    background: #ffffff;
    width: 100%;
    max-width: 480px;
    border-radius: 16px;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
    padding: 48px 40px;
    text-align: center;
  }
  .emoji { font-size: 56px; line-height: 1; }
  h1 {
    margin-top: 18px;
    font-size: 26px;
    font-weight: 800;
    color: #111827;
    letter-spacing: -0.02em;
  }
  p.sub { margin-top: 12px; font-size: 15px; color: #6b7280; line-height: 1.6; }
  .ticket {
    margin: 26px auto 0;
    display: inline-block;
    background: #f5f3ff;
    border: 1px dashed #c4b5fd;
    border-radius: 10px;
    padding: 12px 22px;
    font-size: 13px;
    font-weight: 600;
    color: #5b21b6;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  a.back {
    display: inline-block;
    margin-top: 28px;
    font-size: 14px;
    color: #4f46e5;
    text-decoration: none;
    font-weight: 600;
  }
  a.back:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="card">
    <div class="emoji">🎉</div>
    <h1>You're registered for DevFest 2026!</h1>
    <p class="sub">Your spot is confirmed. A confirmation email with your ticket and the full schedule is on its way to your inbox.</p>
    <div class="ticket">April 18–19 · Tel Aviv Expo · Hall 2</div>
    <br>
    <a class="back" href="index.html">← Back to registration</a>
  </div>
</body>
</html>
