# Copy to profile.yaml and fill in. profile.yaml is gitignored.
owner:
  name: "Arjun"
  timezone: "Asia/Kolkata"
  interests: ["ai", "cars", "tech"]

social:
  youtube:
    handle: ""
    channels: []                            # channel IDs for "my feed"
  x:
    handle: ""
  instagram:
    handle: ""

agent:
  persona: "concise, factual, no filler"

# Used by apply_to_job. resume_path/cover_letter_path are relative to workspace/
# (or absolute) — put the actual files there yourself; nothing uploads them for you.
applicant:
  first_name: ""
  last_name: ""
  email: ""
  phone: ""
  address: {line1: "", city: "", postal_code: "", country: ""}
  linkedin: ""
  resume_path: "documents/resume.pdf"
  cover_letter_path: "documents/cover_letter.pdf"
  work_authorization: {us_citizen: true, sponsorship_needed: false}
  demographics: {gender: "", race: "", veteran_status: "", disability_status: ""}
  custom_qa:
    "Why do you want to work here?": ""

# Per-site login credentials for apply_to_job, matched by hostname (subdomains
# match their parent, e.g. "greenhouse.io" also matches "boards.greenhouse.io").
# Passed to browser-use as sensitive_data — the model sees only field names,
# never these raw values.
site_credentials:
  greenhouse.io: {username_field_value: "", password: ""}
